<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/leave-request-detail.js"></script>
  <script type="module" src="js/ai.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="brand">LeaveEasy</div>
    <a href="index.html">หน้าแรก</a>
    <a href="leave-requests.html">รายการใบลา</a>
    <a href="new-leave-request.html">ยื่นใบลาใหม่</a>
    <a href="leave-types.html">จัดการประเภท</a>
    <a href="dashboard.html">แดชบอร์ด</a>
    <div class="nav-user">
      <span id="nav-user"></span>
      <button id="btn-logout" hidden>ออกจากระบบ</button>
      <a id="nav-login" href="login.html">เข้าสู่ระบบ</a>
    </div>
  </header>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <div class="card">
      <div class="field-row"><span class="k">หัวข้อ</span><span id="d-title"></span></div>
      <div class="field-row"><span class="k">เหตุผล</span><span id="d-reason"></span></div>
      <div class="field-row"><span class="k">ประเภทการลา</span><span id="d-leaveTypeName"></span></div>
      <div class="field-row"><span class="k">วันที่เริ่มลา</span><span id="d-startDate"></span></div>
      <div class="field-row"><span class="k">วันที่สิ้นสุด</span><span id="d-endDate"></span></div>
      <div class="field-row"><span class="k">ผู้ขอลา</span><span id="d-requesterName"></span></div>
      <div class="field-row"><span class="k">ผู้อนุมัติ</span><span id="d-approverName"></span></div>
      <div class="field-row"><span class="k">วันที่ยื่น</span><span id="d-createdAt"></span></div>
      <div class="field-row"><span class="k">สถานะ</span><span id="d-status"></span></div>
    </div>

    <div class="card">
      <div class="btn-row">
        <button id="btn-approve" class="btn btn-ok">อนุมัติ</button>
        <button id="btn-reject" class="btn btn-danger">ไม่อนุมัติ</button>
        <button id="btn-delete" class="btn btn-danger">ลบใบลานี้</button>
      </div>
    </div>

    <div class="card">
      <button id="btn-ai-summary" type="button">ให้ AI สรุปใบลานี้</button>
      <div id="ai-summary-box" hidden class="alert alert-ai" style="margin-top: 12px;"></div>
    </div>

    <div class="card">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="approval-list"></div>

      <label for="approval-input">เขียนความเห็นใหม่</label>
      <textarea id="approval-input" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="approval-error" hidden class="alert alert-error"></div>
      <div class="btn-row">
        <button type="button" id="btn-send-approval">ส่งความเห็น</button>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" id="btn-back" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>
</body>
</html>
